name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle (8.10.2)
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2'

    - name: Install Android Platform 35 & Accept Licenses
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt

    - name: Upload Build Log on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-failure-log
        path: build_log.txt

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: jelly-gallery-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14
